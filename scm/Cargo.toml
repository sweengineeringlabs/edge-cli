[package]
name = "swe-edge-bin"
version = "0.1.0"
edition = "2021"
description = "edge CLI — domain and config validator, curl test scaffolder"
license = "MIT"
repository = "https://github.com/sweengineeringlabs/edge"
authors = ["SWE Labs"]
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
walkdir = "2"

[package.metadata.struct-engine]
application_type = "lib"
service_type = "cli"


[lib]
name = "swe_edge_bin"
path = "main/src/lib.rs"

[[bin]]
name = "edge"
path = "main/src/main.rs"

[[test]]
name = "main_e2e_test"
path = "tests/main_e2e_test.rs"

